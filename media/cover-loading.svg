<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cover is loading">
<title>Cover is loading</title>
<style>
.ico{transform:translate(158.72px,158.72px) scale(8.1067)}
.glow{animation:glow 2.4s ease-in-out infinite}
.shine{animation:shine 1.7s linear infinite}
.dash{stroke-dasharray:34 66;animation:dash 1.3s linear infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes shine{0%{transform:translateX(-819.2px)}100%{transform:translateX(307.2px)}}
@keyframes dash{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.glow,.shine,.dash{animation:none}}
</style>
<defs><clipPath id="tile"><rect width="512" height="512" rx="31"/></clipPath>
<radialGradient id="bg" cx="50%" cy="44%" r="72%">
<stop offset="0" stop-color="#2C313C"/>
<stop offset="0.68" stop-color="#1B1E25"/>
<stop offset="1" stop-color="#15171C"/>
</radialGradient>
<radialGradient id="warm" cx="50%" cy="50%" r="55%">
<stop offset="0" stop-color="#FFCC00" stop-opacity="0.11"/>
<stop offset="1" stop-color="#FFCC00" stop-opacity="0"/>
</radialGradient>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0.27">
<stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0"/>
<stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.09"/>
<stop offset="0.56" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<filter id="halo" x="-20%" y="-60%" width="140%" height="220%">
<feGaussianBlur stdDeviation="0.5" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g clip-path="url(#tile)">
<rect width="512" height="512" fill="url(#bg)"/>
<g class="grooves" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.4"><circle cx="256" cy="256" r="11.4"/><circle cx="256" cy="256" r="22.8"/><circle cx="256" cy="256" r="34.2"/><circle cx="256" cy="256" r="45.6"/><circle cx="256" cy="256" r="57.0"/><circle cx="256" cy="256" r="68.4"/><circle cx="256" cy="256" r="79.8"/><circle cx="256" cy="256" r="91.2"/><circle cx="256" cy="256" r="102.6"/><circle cx="256" cy="256" r="114.0"/><circle cx="256" cy="256" r="125.4"/><circle cx="256" cy="256" r="136.8"/><circle cx="256" cy="256" r="148.2"/><circle cx="256" cy="256" r="159.6"/><circle cx="256" cy="256" r="171.0"/><circle cx="256" cy="256" r="182.4"/><circle cx="256" cy="256" r="193.8"/><circle cx="256" cy="256" r="205.2"/><circle cx="256" cy="256" r="216.6"/><circle cx="256" cy="256" r="228.0"/><circle cx="256" cy="256" r="239.4"/><circle cx="256" cy="256" r="250.8"/><circle cx="256" cy="256" r="262.2"/><circle cx="256" cy="256" r="273.6"/><circle cx="256" cy="256" r="285.0"/><circle cx="256" cy="256" r="296.4"/><circle cx="256" cy="256" r="307.8"/><circle cx="256" cy="256" r="319.2"/><circle cx="256" cy="256" r="330.6"/><circle cx="256" cy="256" r="342.0"/><circle cx="256" cy="256" r="353.4"/></g>
<rect class="glow" width="512" height="512" fill="url(#warm)"/>
<rect class="shine" width="1331.2" height="512" fill="url(#band)"/>
<g class="ico" fill="none" stroke-linecap="round">
<path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2.2"/>
<path class="dash" d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0" pathLength="100" stroke="#FFCC00" stroke-width="2.4" filter="url(#halo)"/>
</g>
</g>
<rect x="0.5" y="0.5" width="511" height="511" rx="30.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
